# 机械臂识别、抓取、放置动作和固定关节姿态均在代码中严格沿用
# juesai/grab2016_7_21.py。本配置定义启动回零、比赛轮次与七个车辆任务点。
max_rounds: 2

# 卡片已连续三帧确认后的结果展示/移卡时间。原脚本固定等待 10 秒。
card_confirm_hold_time: 1.5

# 比赛机械臂动作节拍。笛卡尔速度在原实测值上统一提高到 1.5 倍；固定关节
# 姿态的驱动速度由原来的 10% 提高到 20%；运动及夹爪动作后的稳定等待缩短
# 到原来的 60%（例如关节姿态等待由 8.0 秒变为 4.8 秒）。
# 首次实机验证请保持急停可用并先空载运行；代码会将笛卡尔倍率限制在 2.0 以内。
cartesian_speed_scale: 1.5
joint_speed_percent: 20.0
# 从运输零位展开到抓取/放置观察位时使用更高的关节速度。
observation_joint_speed_percent: 30.0
# 放置松爪后回运输位也使用更高速度；其他回零动作仍使用上面的 20%。
place_stow_joint_speed_percent: 30.0
motion_delay_scale: 0.6

# 机械臂视觉检测期间由 piper_task 自己发布标注图，避免另一个线程并发读取
# RealSense。final_vision 订阅后在总控窗口显示，并把状态转到总控终端。
detection_image_topic: /piper_task/detection_image
detection_status_topic: /piper_task/detection_status

# 抓取时以下边距用于限制检测框中心；检测框可进入软边距，但与真实图像
# 边界的距离不能小于 pick_hard_border_margin。这样目标完整可见时允许抓取，
# x=0/x=639 等已经被裁切的目标仍会拒绝。放置仍要求整个框位于软边距内。
object_edge_margin_x: 40
object_edge_margin_y: 30
pick_hard_border_margin: 8

# 正常深度仍沿用原始检测框百分位算法；超出任务范围时才使用滤波帧恢复，
# 并在当前车辆任务点继续采样，不会因为单帧异常立即驶向下一候选点。
pick_depth_min: 0.25
pick_depth_max: 0.70
place_depth_min: 0.30
place_depth_max: 0.70
depth_retry_extra_frames: 45
depth_stable_samples: 5
depth_stability_max_spread: 0.03
depth_fallback_min_valid_ratio: 0.05

# 节点启动时先调用 /go_zero_srv，并等待 /joint_states_single 确认六个关节
# 连续若干帧进入零位容差；完成前不会初始化相机，也不会开放任务订阅。
startup_joint_state_topic: /joint_states_single
go_zero_service: /go_zero_srv
go_zero_is_mit_mode: false
go_zero_service_timeout: 10.0
go_zero_motion_timeout: 30.0
go_zero_joint_tolerance: 0.05
go_zero_stable_samples: 5

# 比赛中失败恢复的 stow 在缩放后固定等待结束，还会用实时关节反馈确认零位。
# 未确认到位时不会允许车辆进入倒车恢复。
runtime_joint_verify_timeout: 3.0
runtime_joint_tolerance: 0.05
runtime_joint_stable_samples: 3

# 车辆停靠航点与机械臂动作的固定映射：
# 1=目标卡片，2~4=三个抓取候选位置，5~7=三个放置候选位置。
vehicle_stop_actions:
  piper_stop_1: card
  piper_stop_2: pick1
  piper_stop_3: pick2
  piper_stop_4: pick3
  piper_stop_5: place1
  piper_stop_6: place2
  piper_stop_7: place3
