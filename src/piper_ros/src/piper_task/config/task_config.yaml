# 机械臂识别、抓取、放置动作和固定关节姿态均在代码中严格沿用
# juesai/grab2016_7_21.py。本配置只定义比赛轮次与七个车辆任务点。
max_rounds: 2

# 车辆停靠航点与机械臂动作的固定映射：
# 1=目标卡片，2~4=三个抓取候选位置，5~7=三个放置候选位置。
vehicle_stop_actions:
  piper_stop_1: card
  piper_stop_2: pick1
  piper_stop_3: pick2
  piper_stop_4: pick3
  piper_stop_5: place1
  piper_stop_6: place2
  piper_stop_7: place3
